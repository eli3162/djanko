<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css" /><script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script></script><title>DVD Screensaver</title></head><body><h6 id="sprite">ETHAN</h6><script type="py">from js import*
import asyncio,pyodide_js
from pyodide.ffi import create_proxy
from pyscript import*
pressed_keys=set()
def on_keydown(event):pressed_keys.add(event.key)
def on_keyup(event):pressed_keys.discard(event.key)
keydown_proxy=create_proxy(on_keydown)
keyup_proxy=create_proxy(on_keyup)
document.addEventListener('keydown',keydown_proxy)
document.addEventListener('keyup',keyup_proxy)
def key_pressed(key_name):return key_name in pressed_keys
def get_mouse_position(event):global client_mouse_x,client_mouse_y;client_mouse_x=event.clientX;client_mouse_y=event.clientY
mouse_proxy=create_proxy(get_mouse_position)
document.addEventListener('mousemove',mouse_proxy)
client_mouse_x=0
client_mouse_y=0
def mouse_x():global client_mouse_x;return client_mouse_x
def mouse_y():global client_mouse_y;return client_mouse_y
def create_element(html):element=document.createElement('div');element.innerHTML=html;document.body.appendChild(element);return element
def goto(element,x,y):rect=element.getBoundingClientRect();height=rect.height;y_height=document.documentElement.clientHeight;left=x;y=y+(y_height-height);top=y_height-y;element.style.left=f"{left}px";element.style.top=f"{top}px";document.body.style.overflow='hidden';return left,top</script><script type="py">from js import*
import math,random,asyncio
async def main():
	A=False;sprite=document.getElementById('sprite');sprite.style.position='absolute';sprite.style.color='blue';sprite.style.fontSize='200px';await asyncio.sleep(.01);height=sprite.getBoundingClientRect().height;width=sprite.getBoundingClientRect().width;x=50;y=100;rotation=random.randint(0,360);speed=random.randint(5,50);delta_x=math.sin(rotation*3.14/180)*speed;delta_y=math.cos(rotation*3.14/180)*speed
	while True:
		y_height=document.documentElement.clientHeight-height;x_width=document.documentElement.clientWidth-width
		if not x_width>x>=0 or not y_height>y>=0:
			if(x_width>x>=0)==A:delta_x=-1*delta_x
			if(y_height>y>=0)==A:delta_y=-1*delta_y
		x=x+delta_x;y=y+delta_y;goto(sprite,x,y);await asyncio.sleep(.01)
main()</script></body></html>
